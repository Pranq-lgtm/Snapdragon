[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapdragon-local-review"
version = "0.1.0"
description = "Private local preflight checks for code and Vercel deployments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qnn = ["onnxruntime-qnn>=1.18"]
dev = ["pytest>=8.0"]

[project.scripts]
snapdragon-review = "snapdragon_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snapdragon_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
